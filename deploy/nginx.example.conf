# Illustrative HTTPS origin; substitute your hostname and EXISTING bootstrap TLS certificate.
# Do not route the unauthenticated legacy scripts/dev-server.mjs to this vhost.
server {
    listen 443 ssl;
    server_name certs.example.com;
    ssl_certificate /etc/letsencrypt/live/certs.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/certs.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 64k;
    # Do not log invitation identifiers, bodies, authorization or response payloads.
    access_log off;
    location / {
        proxy_pass http://127.0.0.1:4173;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 35s;
    }
}
